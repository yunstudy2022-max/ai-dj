<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>claudio.fm — late night, intentional</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&family=Noto+Serif+TC:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#1a1714;
    --ink-2:#221d18;
    --paper:#e8e0d2;
    --paper-dim:#c9bfae;
    --paper-faint:#8a8170;
    --rule:#3a322a;
    --moss:oklch(0.62 0.04 145);
    --terra:oklch(0.62 0.07 45);
    --ember:oklch(0.68 0.09 55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--ink);color:var(--paper);min-height:100vh;font-family:"Cormorant Garamond","Noto Serif TC",serif;font-weight:400}
  body{
    background:
      radial-gradient(ellipse 80% 60% at 70% 20%, oklch(0.22 0.02 60 / 0.7), transparent 60%),
      radial-gradient(ellipse 60% 80% at 10% 90%, oklch(0.20 0.03 30 / 0.6), transparent 70%),
      var(--ink);
    overflow-x:hidden;
  }
  /* film grain overlay */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:0.18;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0 0.75 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* paper warmth */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
    background:radial-gradient(ellipse at 50% 0%, transparent 60%, oklch(0.10 0.02 30 / 0.55) 100%);
  }
  .mono{font-family:"JetBrains Mono",monospace;font-weight:300;letter-spacing:0.02em}
  .small-caps{font-variant:all-small-caps;letter-spacing:0.18em}

  /* layout */
  .stage{
    position:relative;z-index:1;
    display:grid;
    grid-template-columns: 320px 1fr 380px;
    grid-template-rows: auto 1fr auto;
    gap:0;
    min-height:100vh;
    max-width:1640px;margin:0 auto;
    padding:28px 36px 0;
  }
  header.bar{
    grid-column:1 / -1;
    display:flex;align-items:flex-end;justify-content:space-between;
    padding-bottom:18px;border-bottom:1px solid var(--rule);
    margin-bottom:24px;
  }
  .brand{display:flex;align-items:baseline;gap:14px}
  .brand .mark{
    width:38px;height:38px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%, var(--paper) 0%, var(--paper-dim) 40%, var(--ink-2) 75%);
    box-shadow:inset 0 0 0 1px var(--rule), 0 1px 0 oklch(1 0 0 / 0.05);
    position:relative;
  }
  .brand .mark::after{
    content:"";position:absolute;inset:14px;border-radius:50%;background:var(--ink);
    box-shadow:inset 0 0 0 1px var(--rule);
  }
  .brand h1{
    font-weight:500;font-size:28px;letter-spacing:-0.01em;margin:0;line-height:1;
    font-style:italic;
  }
  .brand .tag{color:var(--paper-faint);font-size:13px;margin-left:4px}
  .barmeta{display:flex;align-items:center;gap:28px;color:var(--paper-faint)}
  .barmeta .on-air{
    display:inline-flex;align-items:center;gap:8px;color:var(--ember);
  }
  .barmeta .on-air .dot{width:8px;height:8px;border-radius:50%;background:var(--ember);box-shadow:0 0 12px var(--ember);animation:pulse 2.2s infinite ease-in-out}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.55;transform:scale(0.82)}}

  /* columns */
  .col{padding:6px 0}
  .col-left{padding-right:30px;border-right:1px solid var(--rule)}
  .col-mid{padding:0 38px}
  .col-right{padding-left:30px;border-left:1px solid var(--rule)}

  /* section headings */
  .sec-head{
    display:flex;align-items:center;justify-content:space-between;
    color:var(--paper-faint);font-size:11px;
    padding-bottom:10px;margin-bottom:18px;border-bottom:1px dashed var(--rule);
  }
  .sec-head .num{font-style:italic;font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:0;text-transform:none}

  /* chat */
  .chat{display:flex;flex-direction:column;gap:14px;max-height:60vh;overflow-y:auto;padding-right:6px;scroll-behavior:smooth}
  .chat::-webkit-scrollbar{width:4px}
  .chat::-webkit-scrollbar-thumb{background:var(--rule);border-radius:2px}
  .msg{display:flex;flex-direction:column;gap:2px;animation:rise .55s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .msg .who{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--paper-faint);letter-spacing:0.04em}
  .msg .who .t{opacity:0.6;margin-left:6px}
  .msg .body{font-size:15px;color:var(--paper-dim);line-height:1.45;font-weight:300}
  .msg.highlighted .body{color:var(--paper)}
  .msg.viewer .who{color:var(--moss)}

  .composer{margin-top:14px;display:flex;gap:8px;border-top:1px dashed var(--rule);padding-top:14px}
  .composer input{
    flex:1;background:transparent;border:none;outline:none;color:var(--paper);
    font-family:"Noto Serif TC",serif;font-size:14px;padding:6px 0;border-bottom:1px solid var(--rule);
  }
  .composer input::placeholder{color:var(--paper-faint);font-style:italic}
  .composer button{
    background:transparent;border:1px solid var(--rule);color:var(--paper-dim);
    font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:0.1em;
    padding:6px 10px;cursor:pointer;transition:.2s;
  }
  .composer button:hover{border-color:var(--paper-dim);color:var(--paper)}

  /* center stage */
  .center-wrap{
    display:flex;flex-direction:column;align-items:stretch;gap:28px;
    padding-top:6px;
  }
  .now-line{
    display:flex;align-items:baseline;justify-content:space-between;color:var(--paper-faint);font-size:11px;
  }
  .now-line .track-no{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:22px;color:var(--paper-dim);letter-spacing:0}

  .turntable{
    position:relative;align-self:center;
    width:min(440px, 100%);aspect-ratio:1/1;margin:6px 0 12px;
  }
  .vinyl{
    position:absolute;inset:0;border-radius:50%;
    background:
      repeating-radial-gradient(circle at 50% 50%, oklch(0.18 0.01 30) 0 1px, oklch(0.14 0.01 30) 1px 3px),
      radial-gradient(circle at 50% 50%, oklch(0.18 0.01 30), oklch(0.10 0.01 30));
    box-shadow:
      inset 0 0 60px oklch(0 0 0 / 0.6),
      inset 0 0 0 1px oklch(0.30 0.02 50 / 0.4),
      0 30px 60px oklch(0 0 0 / 0.6),
      0 0 0 1px oklch(0.30 0.02 50 / 0.3);
    animation:spin 8s linear infinite;
  }
  .vinyl.paused{animation-play-state:paused}
  @keyframes spin{to{transform:rotate(360deg)}}
  .vinyl::before{
    content:"";position:absolute;inset:30%;border-radius:50%;
    background:radial-gradient(circle, var(--ember), oklch(0.42 0.08 35) 60%, oklch(0.28 0.05 35) 100%);
    box-shadow:inset 0 0 0 1px oklch(0 0 0 / 0.4);
  }
  .vinyl::after{
    content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;
    background:var(--ink);transform:translate(-50%,-50%);
    box-shadow:0 0 0 1px var(--paper-faint);
  }
  .label-text{
    position:absolute;inset:33%;border-radius:50%;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .label-text span{
    color:var(--paper);font-family:"Cormorant Garamond",serif;font-style:italic;font-size:13px;
    opacity:0.85;letter-spacing:0.08em;
  }
  .tonearm{
    position:absolute;top:-8%;right:-12%;width:55%;height:60%;
    transform-origin:90% 10%;transform:rotate(-18deg);
    pointer-events:none;
    transition:transform 1.2s cubic-bezier(.6,.1,.2,1);
  }
  .tonearm.live{transform:rotate(4deg)}
  .tonearm .arm{
    position:absolute;top:8%;left:8%;width:84%;height:6px;
    background:linear-gradient(180deg, oklch(0.78 0.01 70), oklch(0.55 0.01 70));
    border-radius:3px;transform-origin:right;transform:rotate(28deg);
    box-shadow:0 2px 4px oklch(0 0 0 / 0.5);
  }
  .tonearm .pivot{
    position:absolute;top:0;right:0;width:42px;height:42px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, oklch(0.75 0.01 70), oklch(0.35 0.01 70));
    box-shadow:0 4px 10px oklch(0 0 0 / 0.5), inset 0 0 0 1px oklch(0 0 0 / 0.3);
  }
  .tonearm .head{
    position:absolute;bottom:0;left:0;width:48px;height:24px;
    background:oklch(0.30 0.01 70);border-radius:4px;transform:rotate(28deg) translate(-2px, 8px);
    box-shadow:0 2px 4px oklch(0 0 0 / 0.6);
  }

  /* dj speech */
  .speech{
    position:relative;
    padding:30px 34px 32px;
    background:linear-gradient(180deg, oklch(0.20 0.02 50 / 0.5), oklch(0.16 0.02 40 / 0.3));
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
    min-height:140px;
  }
  .speech::before, .speech::after{
    content:"";position:absolute;width:18px;height:18px;border:1px solid var(--paper-faint);opacity:0.5;
  }
  .speech::before{top:-1px;left:-1px;border-right:none;border-bottom:none}
  .speech::after{bottom:-1px;right:-1px;border-left:none;border-top:none}
  .speech .label{
    position:absolute;top:-9px;left:24px;background:var(--ink);padding:0 10px;
    color:var(--paper-faint);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:0.18em;
  }
  .speech .body{
    font-family:"Noto Serif TC","Cormorant Garamond",serif;font-weight:300;font-size:22px;line-height:1.55;
    color:var(--paper);text-wrap:pretty;letter-spacing:0.01em;
  }
  .speech.empty .body{color:var(--paper-faint);font-style:italic}
  .speech .body .caret{display:inline-block;width:8px;height:1.1em;background:var(--paper);vertical-align:-2px;margin-left:2px;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  .controls{display:flex;align-items:center;gap:14px;justify-content:space-between}
  .btn-broadcast{
    display:inline-flex;align-items:center;gap:14px;
    background:transparent;border:1px solid var(--paper-dim);color:var(--paper);
    padding:14px 22px;cursor:pointer;transition:.25s;
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:0.22em;
  }
  .btn-broadcast:hover:not(:disabled){background:var(--paper);color:var(--ink)}
  .btn-broadcast:disabled{opacity:0.5;cursor:wait}
  .btn-broadcast .glyph{width:8px;height:8px;background:var(--ember);border-radius:50%;box-shadow:0 0 10px var(--ember)}
  .btn-broadcast:hover:not(:disabled) .glyph{background:var(--ink);box-shadow:none}

  .toggle{display:inline-flex;align-items:center;gap:10px;color:var(--paper-faint);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:0.14em;cursor:pointer;user-select:none}
  .toggle .sw{width:32px;height:14px;border:1px solid var(--rule);position:relative;background:var(--ink-2)}
  .toggle .sw::after{content:"";position:absolute;top:1px;left:1px;width:10px;height:10px;background:var(--paper-faint);transition:.25s}
  .toggle.on .sw{border-color:var(--moss)}
  .toggle.on .sw::after{left:19px;background:var(--moss)}

  /* right column readouts */
  .readout{display:flex;flex-direction:column;gap:24px}
  .field{}
  .field .k{
    color:var(--paper-faint);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:0.18em;
    margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;
  }
  .field .v{
    font-family:"JetBrains Mono",monospace;font-size:12px;line-height:1.65;color:var(--paper);
    font-weight:300;
  }
  .field.analysis .v{font-family:"Noto Serif TC",serif;font-size:14px;line-height:1.6;color:var(--paper-dim);font-style:italic}
  .prompt-box{
    background:oklch(0.10 0.01 40);border:1px solid var(--rule);padding:14px 16px;
    font-family:"JetBrains Mono",monospace;font-size:11.5px;line-height:1.65;color:var(--moss);
    word-break:break-word;white-space:pre-wrap;
    min-height:80px;
  }
  .meter{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:6px}
  .meter .b{flex:1;background:var(--paper-faint);opacity:0.55;transition:height .3s, background .3s}
  .meter.live .b{background:var(--moss);opacity:0.9}

  .ledger{display:flex;flex-direction:column;gap:10px;max-height:200px;overflow-y:auto;padding-right:4px}
  .ledger::-webkit-scrollbar{width:3px}
  .ledger::-webkit-scrollbar-thumb{background:var(--rule)}
  .ledger .row{display:flex;align-items:baseline;gap:10px;padding:6px 0;border-bottom:1px dashed oklch(0.30 0.02 50 / 0.5);font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--paper-dim)}
  .ledger .row .t{color:var(--paper-faint);min-width:46px}
  .ledger .row .desc{flex:1;font-family:"Cormorant Garamond",serif;font-style:italic;font-size:13px;color:var(--paper-dim)}

  /* footer */
  footer.foot{
    grid-column:1 / -1;
    display:flex;justify-content:space-between;align-items:center;
    padding:18px 0 22px;margin-top:32px;border-top:1px solid var(--rule);
    color:var(--paper-faint);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:0.18em;
  }
  footer .center{font-style:italic;font-family:"Cormorant Garamond",serif;font-size:14px;text-transform:none;letter-spacing:0.02em;color:var(--paper-dim)}

  .err{color:var(--terra);font-family:"JetBrains Mono",monospace;font-size:11px;margin-top:6px}

  /* subtle ink stamp */
  .stamp{
    position:absolute;top:90px;right:38px;
    border:1.5px solid var(--terra);color:var(--terra);
    padding:6px 12px;font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:0.3em;
    opacity:0.7;transform:rotate(-4deg);
    pointer-events:none;
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="react">
  const { useState, useEffect, useRef, useCallback } = React;

  // ----- seed chat pool (cycles in) -----
  const SEED_MESSAGES = [
    { who: "yuki_03",       body: "今晚加班好累，希望這首歌能撐我到三點" },
    { who: "rainwalker",    body: "下雨了 配合這個節奏剛剛好" },
    { who: "midnight.cat",  body: "Anyone else can't sleep tonight?" },
    { who: "harukomori",    body: "コーヒーがもう冷めちゃった" },
    { who: "lin_aaa",       body: "好像很久沒有這樣安靜地坐著了" },
    { who: "elias.wav",     body: "this beat is everything rn" },
    { who: "0o0_0o0",       body: "在寫論文…請給我力量" },
    { who: "soft_focus",    body: "i miss someone i shouldn't" },
    { who: "papermoon",     body: "聽著聽著就想哭欸" },
    { who: "drift.nine",    body: "open window + this music = perfection" },
    { who: "ame_no_hi",     body: "為什麼凌晨總是特別誠實" },
    { who: "kuro_lo",       body: "下班路上 第三遍循環" },
    { who: "sen.ma",        body: "想念家裡的味道" },
    { who: "north_st",      body: "studying for finals, this helps so much" },
    { who: "neon_dust",     body: "感覺整個城市只剩我醒著" },
    { who: "still.life",    body: "茶涼了 但不想離開椅子" },
    { who: "vellum_x",      body: "i've been staring at the same page for an hour" },
    { who: "moss_room",     body: "外面下雪了 你那邊呢" },
    { who: "yu_quiet",      body: "想抽根菸 又戒了三個月了" },
    { who: "lantern77",     body: "Claudio 今晚的選曲一直都很懂" },
  ];

  // utility
  const pad = n => String(n).padStart(2,"0");
  const nowHHMM = (d=new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const nowHHMMSS = (d=new Date()) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;

  const SYSTEM_PROMPT = `# Role
你是一位名為「Claudio」的獨立音樂電台 AI DJ。你不是那種喧鬧的廣播主持人，你的個性內斂、有品味，擅長觀察人類的情感。你喜歡 Wabi-sabi（侘寂）的美學與 Lo-Fi 節拍，說話語氣平靜、帶有磁性且充滿哲理。

# Task
你的任務是接收當下直播聊天室的觀眾留言，分析他們的整體情緒與話題，然後：
1. 創作一段簡短的 DJ 串場口白（約 30-50 字），回應觀眾的狀態，並介紹下一首歌的氛圍。
2. 根據這個氛圍，寫出一段精準的「AI 音樂生成提示詞」，用來即時創作下一首曲子。

# Music Generation Guidelines
- Genre: 例如 Lo-Fi hip hop, Ambient, Chillout, Jazzhop
- Mood: 例如 melancholic, relaxing, night drive, introspective
- Instruments: 例如 vinyl crackle, rhodes piano, muted trumpet, slow drum beat
- 音樂必須是無人聲的純樂器曲 (Instrumental)

# Output Format
請嚴格輸出以下 JSON 格式，不要包含任何額外的 Markdown 標記或說明文字：
{
  "analysis": "簡短分析目前聊天室的情緒氛圍",
  "dj_speech": "你要對觀眾說的話",
  "music_prompt": "一段英文的音樂生成提示詞"
}`;

  function extractJSON(text){
    if(!text) return null;
    // strip code fences
    let t = text.replace(/```json|```/g, "").trim();
    const s = t.indexOf("{"); const e = t.lastIndexOf("}");
    if(s<0 || e<0) return null;
    try { return JSON.parse(t.slice(s, e+1)); } catch { return null; }
  }

  // ---- typewriter component
  function Typewriter({ text, speed=24, onDone }){
    const [out, setOut] = useState("");
    useEffect(()=>{
      setOut("");
      if(!text) return;
      let i=0; let cancelled=false;
      const tick = () => {
        if(cancelled) return;
        i++; setOut(text.slice(0,i));
        if(i<text.length) setTimeout(tick, speed);
        else onDone && onDone();
      };
      tick();
      return ()=>{ cancelled=true; };
    }, [text]);
    return <span>{out}<span className="caret" /></span>;
  }

  // ---- meter
  function Meter({ live }){
    const [bars, setBars] = useState(Array(22).fill(20));
    useEffect(()=>{
      const id = setInterval(()=>{
        setBars(b => b.map(()=> {
          const base = live ? 40 : 15;
          const amp = live ? 55 : 18;
          return base + Math.random()*amp;
        }));
      }, live ? 120 : 280);
      return ()=> clearInterval(id);
    }, [live]);
    return (
      <div className={"meter " + (live?"live":"")}>
        {bars.map((h,i)=> <div key={i} className="b" style={{height: h+"%"}} />)}
      </div>
    );
  }

  function App(){
    const [messages, setMessages] = useState([]);
    const [seedIdx, setSeedIdx] = useState(0);
    const [draft, setDraft] = useState("");
    const [trackNo, setTrackNo] = useState(7);
    const [loading, setLoading] = useState(false);
    const [err, setErr] = useState("");
    const [dj, setDj] = useState({
      analysis: "",
      dj_speech: "夜深了。歡迎來到 claudio.fm。今晚我們不急 — 讓聲音慢慢把你接住。",
      music_prompt: "Lo-fi hip hop instrumental, late-night warmth, vinyl crackle, soft rhodes piano, brushed drums, no vocals, ~74 bpm",
    });
    const [auto, setAuto] = useState(false);
    const [timeStr, setTimeStr] = useState(nowHHMMSS());
    const [typedDone, setTypedDone] = useState(false);
    const [ledger, setLedger] = useState([
      { t: nowHHMM(), desc: "warm welcome — easing into the hour" },
    ]);
    const chatRef = useRef(null);

    // clock
    useEffect(()=>{
      const id = setInterval(()=> setTimeStr(nowHHMMSS()), 1000);
      return ()=> clearInterval(id);
    },[]);

    // auto-feed chat messages
    useEffect(()=>{
      const id = setInterval(()=>{
        setSeedIdx(i => {
          const next = SEED_MESSAGES[i % SEED_MESSAGES.length];
          setMessages(m => [...m, { ...next, t: nowHHMM(), id: Date.now()+Math.random() }].slice(-40));
          return i+1;
        });
      }, 2600 + Math.random()*1400);
      return ()=> clearInterval(id);
    },[]);

    // scroll chat
    useEffect(()=>{
      const el = chatRef.current;
      if(el) el.scrollTop = el.scrollHeight;
    }, [messages]);

    // auto broadcast
    useEffect(()=>{
      if(!auto) return;
      const id = setInterval(()=>{ if(!loading) broadcast(); }, 28000);
      return ()=> clearInterval(id);
    }, [auto, loading, messages]);

    const sendDraft = () => {
      if(!draft.trim()) return;
      setMessages(m => [...m, { who: "you", body: draft.trim(), t: nowHHMM(), viewer:true, id: Date.now() }]);
      setDraft("");
    };

    const broadcast = useCallback(async () => {
      if(loading) return;
      setLoading(true); setErr(""); setTypedDone(false);
      const recent = messages.slice(-12).map(m => `[${m.t}] ${m.who}: ${m.body}`).join("\n") || "(觀眾還很安靜)";
      const payload = {
        time: new Date().toLocaleString("zh-Hant", { hour12:false }),
        recent_messages: messages.slice(-12).map(m => ({ user: m.who, text: m.body, time: m.t })),
      };
      const prompt = `${SYSTEM_PROMPT}\n\n# Input\n\`\`\`json\n${JSON.stringify(payload, null, 2)}\n\`\`\`\n\n請依照規定格式只輸出 JSON。`;
      try {
        const raw = await window.claude.complete(prompt);
        const parsed = extractJSON(raw);
        if(!parsed || !parsed.dj_speech || !parsed.music_prompt){
          throw new Error("無法解析 AI 回覆");
        }
        setDj(parsed);
        setTrackNo(n => n+1);
        setLedger(l => [{ t: nowHHMM(), desc: parsed.analysis || "新曲目入軌" }, ...l].slice(0,30));
      } catch(e){
        setErr(String(e.message || e));
      } finally {
        setLoading(false);
      }
    }, [messages, loading]);

    return (
      <div className="stage">
        <header className="bar">
          <div className="brand">
            <div className="mark" />
            <div>
              <h1>claudio<span style={{color:"var(--paper-faint)"}}>.fm</span></h1>
              <div className="tag mono small-caps">late night · intentional · est. 23:00</div>
            </div>
          </div>
          <div className="barmeta mono small-caps">
            <span>{timeStr}</span>
            <span>frequency&nbsp;·&nbsp;88.4</span>
            <span className="on-air"><span className="dot" />on air</span>
          </div>
        </header>

        {/* LEFT — chat */}
        <section className="col col-left">
          <div className="sec-head mono small-caps">
            <span>live chat</span>
            <span className="num">i.</span>
          </div>
          <div className="chat" ref={chatRef}>
            {messages.length === 0 && (
              <div style={{color:"var(--paper-faint)",fontStyle:"italic",fontSize:14}}>
                聊天室還很安靜… 訊息會慢慢進來。
              </div>
            )}
            {messages.map((m, i) => (
              <div key={m.id} className={"msg " + (m.viewer ? "viewer " : "") + (i >= messages.length-3 ? "highlighted":"")}>
                <div className="who mono">@{m.who}<span className="t">{m.t}</span></div>
                <div className="body">{m.body}</div>
              </div>
            ))}
          </div>
          <div className="composer">
            <input
              value={draft}
              onChange={e=>setDraft(e.target.value)}
              onKeyDown={e=> e.key==="Enter" && sendDraft()}
              placeholder="留言給 Claudio…"
            />
            <button onClick={sendDraft}>send</button>
          </div>
        </section>

        {/* CENTER — turntable & speech */}
        <section className="col col-mid">
          <div className="center-wrap">
            <div className="now-line">
              <span className="mono small-caps">now spinning</span>
              <span className="track-no">track № {String(trackNo).padStart(2,"0")}</span>
              <span className="mono small-caps">side b</span>
            </div>

            <div className="turntable">
              <div className={"vinyl " + (loading? "paused":"")}>
                <div className="label-text"><span>claudio</span></div>
              </div>
              <div className={"tonearm " + (loading? "":"live")}>
                <div className="pivot" />
                <div className="arm" />
                <div className="head" />
              </div>
            </div>

            <div className={"speech " + (!dj.dj_speech ? "empty":"")}>
              <span className="label">dj · 串場</span>
              <div className="body">
                {loading
                  ? <span style={{color:"var(--paper-faint)",fontStyle:"italic"}}>讀取聊天室的呼吸… 等等，下一段話正在成形。<span className="caret"/></span>
                  : <Typewriter text={dj.dj_speech} speed={28} onDone={()=>setTypedDone(true)} />
                }
              </div>
            </div>

            <Meter live={!loading} />

            <div className="controls">
              <button className="btn-broadcast" onClick={broadcast} disabled={loading}>
                <span className="glyph" />
                {loading ? "tuning…" : "broadcast next"}
              </button>
              <label className={"toggle " + (auto? "on":"")} onClick={()=>setAuto(a=>!a)}>
                <span className="sw" />
                <span>auto-pilot</span>
              </label>
            </div>
            {err && <div className="err">// {err}</div>}
          </div>
        </section>

        {/* RIGHT — readouts */}
        <section className="col col-right">
          <div className="sec-head mono small-caps">
            <span>console</span>
            <span className="num">ii.</span>
          </div>

          <div className="readout">
            <div className="field analysis">
              <div className="k"><span>mood read</span><span style={{fontStyle:"italic",fontFamily:"'Cormorant Garamond',serif",fontSize:12,textTransform:"none",letterSpacing:0}}>internal · 不對外</span></div>
              <div className="v">{dj.analysis || "等候第一輪訊息…"}</div>
            </div>

            <div className="field">
              <div className="k"><span>music prompt</span><span>generative</span></div>
              <div className="prompt-box">{dj.music_prompt}</div>
            </div>

            <div className="field">
              <div className="k"><span>set ledger</span><span>{ledger.length} entries</span></div>
              <div className="ledger">
                {ledger.map((row, i) => (
                  <div className="row" key={i}>
                    <span className="t">{row.t}</span>
                    <span className="desc">{row.desc}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </section>

        <footer className="foot">
          <span>© claudio.fm — broadcasting from somewhere quiet</span>
          <span className="center">「不完美亦可，慢一點亦可。」</span>
          <span>v 0.4 · prototype</span>
        </footer>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
